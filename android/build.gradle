group 'io.vezz.flutter_local_ai'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'io.vezz.flutter_local_ai'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 26  // Required for ML Kit GenAI
    }
}

dependencies {
    // beta2 (Apr 2026) is the first release with Samsung device support for the
    // Prompt API (Galaxy Z Fold7/Z TriFold on nano-v2, Galaxy S26 on nano-v3) —
    // alpha1 only ever resolved the feature on Pixel 9, so checkStatus() never
    // reported DOWNLOADABLE on Samsung hardware.
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta2'
    implementation 'com.google.mlkit:genai-common:1.0.0-beta2'
    implementation 'com.google.android.gms:play-services-tasks:18.0.2'
}
