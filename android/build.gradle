group 'io.vezz.flutter_local_ai'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'io.vezz.flutter_local_ai'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 26  // Required for ML Kit GenAI
    }
}

dependencies {
    // beta2 (Apr 2026) is the latest published release and carries the widest
    // Prompt API device list: Pixel 9/10 series plus Samsung, Honor, iQOO,
    // Lenovo, Motorola, OnePlus, OPPO, POCO, realme, vivo and Xiaomi flagships
    // (nano-v2 / nano-v3). alpha1 only ever resolved the feature on Pixel 9,
    // so checkStatus() never reported DOWNLOADABLE on anything else.
    // genai-common must stay at beta3 — it's what genai-prompt:beta2 declares
    // in its POM and is the artifact that resolves per-device feature configs;
    // pinning it lower silently shrinks the supported-device set.
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta2'
    implementation 'com.google.mlkit:genai-common:1.0.0-beta3'
    implementation 'com.google.android.gms:play-services-tasks:18.2.0'
}
