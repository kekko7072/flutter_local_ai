group 'io.vezz.flutter_local_ai'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.3.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
// No `apply plugin: 'kotlin-android'`: Flutter 3.44+ applies KGP to plugin
// subprojects itself, and a plugin that applies it too is a hard configuration
// error under AGP 9 with built-in Kotlin — one that fails the whole app build.

android {
    namespace 'io.vezz.flutter_local_ai'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 26  // Required for ML Kit GenAI
    }
}

dependencies {
    // Keep common and coroutine versions aligned with the Prompt API POM.
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
    }
}
