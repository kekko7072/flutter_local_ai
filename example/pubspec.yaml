name: flutter_local_ai_example
description: Example app for flutter_local_ai package
publish_to: 'none'

version: 1.0.0+1

environment:
  # Must not sit below the plugin it consumes via `path: ../`.
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.38.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_ai:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
