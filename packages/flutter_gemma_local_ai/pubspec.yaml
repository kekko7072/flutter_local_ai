name: flutter_gemma_local_ai
description: "flutter_gemma inference engine backed by flutter_local_ai: Gemini Nano (ML Kit GenAI), Apple Foundation Models, Windows AI Foundry and the Chrome Prompt API, driven through the OS instead of a bundled checkpoint."
version: 0.1.0
homepage: https://github.com/kekko7072/flutter_local_ai
repository: https://github.com/kekko7072/flutter_local_ai/tree/main/packages/flutter_gemma_local_ai
topics:
  - gemma
  - llm
  - gemini-nano
  - on-device-ai
  - foundation-models

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_gemma: ^1.8.0
  # Hosted constraint so the package is publishable; the override below
  # points at this repo's copy for local development.
  flutter_local_ai: ^0.1.0

dependency_overrides:
  flutter_local_ai:
    path: ../..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
