name: flutter_local_ai
description: >-
  On-device AI for Flutter — Apple Foundation Models, Android ML Kit GenAI
  (Gemini Nano) and Windows AI APIs. Text generation, streaming, tool calling
  and generative UI specs for the genui renderer.
version: 0.1.0
homepage: https://github.com/kekko7072/flutter_local_ai
topics:
  - ai
  - genui
  - on-device-ai
  - gemini-nano
  - foundation-models

environment:
  # flutter_gemma 1.8.0 requires Dart 3.12 / Flutter 3.44; keep the advertised
  # floor honest.
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  flutter_web_plugins:
    sdk: flutter
  # The flutter_gemma engine ships from `package:flutter_local_ai/gemma.dart`.
  # Dart has no optional dependencies and no structural typing, so
  # implementing InferenceEngineProvider means depending on flutter_gemma.
  flutter_gemma: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Regenerates the native wire contract: dart run pigeon --input pigeon.dart
  pigeon: ^25.5.0

flutter:
  plugin:
    platforms:
      android:
        package: io.vezz.flutter_local_ai
        pluginClass: FlutterLocalAiPlugin
      ios:
        pluginClass: FlutterLocalAiPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutterLocalAiPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: FlutterLocalAiPlugin
      web:
        pluginClass: FlutterLocalAiWeb
        fileName: flutter_local_ai_web.dart
