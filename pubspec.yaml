name: flutter_local_ai
description: >-
  On-device AI for Flutter — Apple Foundation Models, Android ML Kit GenAI
  (Gemini Nano) and Windows AI APIs. Text generation, streaming, tool calling
  and generative UI specs for the genui renderer.
version: 0.0.14
homepage: https://github.com/kekko7072/flutter_local_ai
topics:
  - ai
  - genui
  - on-device-ai
  - gemini-nano
  - foundation-models

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  # genUI integration: lets the package emit specs the genui renderer can build.
  genui: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.vezz.flutter_local_ai
        pluginClass: FlutterLocalAiPlugin
      ios:
        pluginClass: FlutterLocalAiPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutterLocalAiPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: FlutterLocalAiPlugin
