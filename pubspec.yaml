name: flutter_local_ai
# pub.dev truncates past ~180 characters, and scores a longer one down.
description: >-
  On-device AI for Flutter: Apple Foundation Models, Android Gemini Nano,
  Windows AI Foundry, Chrome Prompt API. Text, streaming, tool calling, JSON
  schemas, genUI specs.
version: 0.1.0
homepage: https://github.com/kekko7072/flutter_local_ai
topics:
  - ai
  - genui
  - on-device-ai
  - gemini-nano
  - foundation-models

environment:
  # Keep the package and its flutter_lints 6 development tooling usable on
  # Dart 3.8, which ships with Flutter 3.32.
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Regenerates the native wire contract: dart run pigeon --input pigeon.dart
  pigeon: ^25.5.0

flutter:
  plugin:
    platforms:
      android:
        package: io.vezz.flutter_local_ai
        pluginClass: FlutterLocalAiPlugin
      ios:
        pluginClass: FlutterLocalAiPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutterLocalAiPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: FlutterLocalAiPlugin
      web:
        pluginClass: FlutterLocalAiWeb
        fileName: flutter_local_ai_web.dart
