name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # flutter_gemma 1.8.0 requires Dart >=3.12.0 / Flutter >=3.44.0, and the
  # engine in lib/gemma.dart depends on it. Anything lower cannot resolve.
  FLUTTER_VERSION: "3.44.x"

jobs:
  check:
    name: flutter_local_ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # `dart format` and `flutter analyze` walk the whole tree from the repo
      # root, so the example app needs its own resolution too — otherwise
      # analysis fails on unresolved imports in a directory this job never
      # pub-got.
      - run: flutter pub get --directory example

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # The native hosts are generated from pigeon.dart. Hand-editing the output
  # is easy and silently survives review until a wire mismatch shows up on a
  # device, so the build refuses a diff between what is committed and what
  # the generator produces.
  pigeon:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run pigeon --input pigeon.dart
      - run: dart format .
      - name: Fail if the generated output differs from what is committed
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are stale. Run:" \
                 "dart run pigeon --input pigeon.dart && dart format ."
            exit 1
          fi

  # A plugin that cannot be packaged is broken for everyone downstream, and
  # the failure modes (an ignore rule hiding a pubspec, a missing licence) do
  # not show up in analyze or test.
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter pub publish --dry-run
